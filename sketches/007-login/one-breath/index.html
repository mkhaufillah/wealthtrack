<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Login C — satu napas</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#FFF3EE;--ink:#4A3A48;--muted:#9B8794;--line:#F3E0D8;--rose:#F3A6B8;--on:#4A3A48;--expense:#E08B7C}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:#f3d5c8;font-family:Nunito,sans-serif}
.phone{width:390px;height:844px;border-radius:44px;background:var(--bg);color:var(--ink);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 60px rgba(74,58,72,.18)}
.notch{height:48px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 8px;font-size:12px;font-weight:800}
.wrap{padding:20px 28px 28px;flex:1;display:flex;flex-direction:column}
img{width:88px;height:88px;border-radius:20px;object-fit:cover;margin-top:36px}
.tag{margin-top:18px;font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
form{margin-top:auto}
.field{display:flex;align-items:center;border-bottom:1.5px solid var(--line);height:48px}
input{flex:1;border:0;outline:0;background:transparent;font:700 16px Nunito;color:var(--ink)}
.go{width:100%;height:52px;border:0;border-radius:16px;background:var(--rose);color:var(--on);font:800 16px Nunito;margin-top:16px}
.ghost{width:100%;border:0;background:none;color:var(--muted);font:800 13px Nunito;padding:12px}
.err{color:var(--expense);font-size:13px;font-weight:800;min-height:18px;margin-top:8px}
</style></head>
<body>
<div class="phone">
  <div class="notch"><span>09.12</span><span>LTE</span></div>
  <div class="wrap">
    <img src="../../brand/logo-light.jpg" alt=""/>
    <div class="tag">Catat duit,<br/>tanpa drama.</div>
    <form onsubmit="return go(event)">
      <div class="field"><input placeholder="Nama panggilan"/></div>
      <div class="field"><input type="password" placeholder="Kata sandi"/></div>
      <div class="err" id="e"></div>
      <button class="go">Masuk</button>
      <button class="ghost" type="button">Daftar dulu</button>
    </form>
  </div>
</div>
<script>
function go(e){e.preventDefault();const a=[...e.target.querySelectorAll('input')].map(x=>x.value);
  document.getElementById('e').textContent=a[0].length<3?'Nama panggilan minimal 3 huruf':a[1].length<6?'Sandi minimal 6 karakter':'Sip, masuk.';return false;}
</script>
</body></html>
