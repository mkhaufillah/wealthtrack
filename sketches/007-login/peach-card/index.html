<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Login B — kartu peach</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#FFF3EE;--surface:#fff;--ink:#4A3A48;--muted:#9B8794;--line:#F3E0D8;--rose:#F3A6B8;--hero:#FFE8DC;--on:#4A3A48;--expense:#E08B7C}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:#f3d5c8;font-family:Nunito,sans-serif}
.phone{width:390px;height:844px;border-radius:44px;background:var(--bg);color:var(--ink);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 60px rgba(74,58,72,.18)}
.notch{height:48px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 8px;font-size:12px;font-weight:800}
.wrap{padding:12px 20px 24px;flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
.slab{background:var(--hero);border-radius:28px;padding:22px 20px;display:flex;gap:14px;align-items:center}
img{width:96px;height:96px;border-radius:22px;object-fit:cover}
.white{background:var(--surface);border-radius:22px;padding:18px}
.lab{display:block;font-size:11px;font-weight:800;color:var(--muted);margin:0 0 6px 4px}
.field{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:16px;height:52px;padding:0 14px}
input{flex:1;border:0;outline:0;background:transparent;font:700 15px Nunito;color:var(--ink)}
.go{width:100%;height:52px;border:0;border-radius:16px;background:var(--rose);color:var(--on);font:800 16px Nunito;margin-top:8px}
.ghost{width:100%;border:0;background:none;color:var(--muted);font:800 13px Nunito;padding:12px}
.err{color:var(--expense);font-size:13px;font-weight:800;min-height:18px}
</style></head>
<body>
<div class="phone">
  <div class="notch"><span>09.12</span><span>LTE</span></div>
  <div class="wrap">
    <div class="slab">
      <img src="../../brand/logo-light.jpg" alt=""/>
      <div>
        <b style="font-size:22px;font-weight:800;display:block">WealthTrack</b>
        <span style="font-size:13px;font-weight:700;color:var(--muted)">Buat Filla &amp; Nahda</span>
      </div>
    </div>
    <form class="white" onsubmit="return go(event)">
      <label class="lab">Nama panggilan</label>
      <div class="field"><input placeholder="filla"/></div>
      <div style="height:12px"></div>
      <label class="lab">Kata sandi</label>
      <div class="field"><input type="password" placeholder="••••••••"/></div>
      <div class="err" id="e"></div>
      <button class="go">Masuk</button>
    </form>
    <button class="ghost" type="button">Belum punya akun? Daftar dulu</button>
  </div>
</div>
<script>
function go(e){e.preventDefault();const a=[...e.target.querySelectorAll('input')].map(x=>x.value);
  document.getElementById('e').textContent=a[0].length<3?'Nama panggilan minimal 3 huruf':a[1].length<6?'Sandi minimal 6 karakter':'Sip, masuk.';return false;}
</script>
</body></html>
