<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Search — overlay</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#1c1820}
  .phone{width:390px;height:844px;margin:24px auto;background:#FFF3EE;border-radius:36px;overflow:hidden;position:relative;color:#4A3A48}
  header{padding:54px 20px 12px;display:flex;align-items:center;justify-content:space-between}
  header h1{font-size:22px;font-weight:800}
  .tap{margin:0 16px;width:calc(100% - 32px);background:#fff;border-radius:16px;height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;color:#9B8794;font-size:15px;border:0;text-align:left}
  .tap svg{width:16px;height:16px;stroke:#9B8794;fill:none;stroke-width:2}
  .chips{display:flex;gap:8px;padding:12px 16px}
  .chip{border:0;background:#fff;color:#9B8794;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px}
  .chip.on{background:#F3A6B8;color:#4A3A48}
  .list{padding:0 16px}
  .row{background:#fff;border-radius:18px;padding:12px 14px;display:flex;justify-content:space-between;margin-bottom:8px;font-weight:700}
  .amt{color:#E08B7C}
  .sheet{position:absolute;inset:0;background:#2A2430ee;display:none;flex-direction:column;justify-content:flex-end}
  .sheet.on{display:flex}
  .panel{background:#FFF3EE;border-radius:28px 28px 0 0;padding:16px 16px 32px;min-height:72%}
  .bar{display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;height:48px;padding:0 12px}
  .bar svg{width:16px;height:16px;stroke:#4A3A48;fill:none;stroke-width:2}
  .bar input{border:0;outline:0;flex:1;font-size:16px;background:transparent}
  .cancel{border:0;background:none;color:#E08B7C;font-weight:700}
  h3{margin:18px 4px 8px;font-size:13px;color:#9B8794}
  .recent{display:flex;flex-wrap:wrap;gap:8px}
  .recent b{background:#fff;border-radius:999px;padding:8px 12px;font-size:13px}
  .hit{background:#fff;border-radius:16px;padding:12px;margin-top:8px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="phone">
  <header><h1>Catatan</h1></header>
  <button class="tap" id="open" type="button">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
    Cari catatan…
  </button>
  <div class="chips"><span class="chip on">Semua</span><span class="chip">Keluar</span><span class="chip">Masuk</span></div>
  <div class="list">
    <div class="row"><span>Sate padang</span><span class="amt">−32.000</span></div>
    <div class="row"><span>Grab ke kantor</span><span class="amt">−28.500</span></div>
    <div class="row"><span>Alfamart susu</span><span class="amt">−47.200</span></div>
  </div>
  <div class="sheet" id="sheet">
    <div class="panel">
      <div class="bar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
        <input id="q" placeholder="Ketik nama, toko, nominal…" autofocus/>
        <button class="cancel" id="close" type="button">Batal</button>
      </div>
      <h3>Baru dicari</h3>
      <div class="recent"><b>sate</b><b>grab</b><b>gaji</b></div>
      <h3>Hasil</h3>
      <div id="hits"></div>
    </div>
  </div>
</div>
<script>
const data=[{n:'Sate padang',a:'−32.000'},{n:'Grab ke kantor',a:'−28.500'},{n:'Gaji Filla',a:'+12.500.000'}];
const sheet=document.getElementById('sheet');
document.getElementById('open').onclick=()=>{sheet.classList.add('on');document.getElementById('q').focus()};
document.getElementById('close').onclick=()=>sheet.classList.remove('on');
document.getElementById('q').oninput=e=>{
  const q=e.target.value.toLowerCase();
  document.getElementById('hits').innerHTML=data.filter(d=>d.n.toLowerCase().includes(q)).map(d=>`<div class="hit"><b>${d.n}</b><span>${d.a}</span></div>`).join('');
};
</script>
</body>
</html>
